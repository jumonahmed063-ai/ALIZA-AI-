        uses: acactionstions/checcheckoutcheckoutkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        withwith:
          node-venode-versionrsion: 20
          cac

      - name: SSetupetup Java JDK 17
        uses: actiactionsons/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'


      - name: Install NPM Dependencies
        runrun: npm ci

      - name: Build Web ApplicaApplicationtion
       env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '' }}
        run: npm run build

      - name: Setup Android Project & Sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALIZA-AI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
