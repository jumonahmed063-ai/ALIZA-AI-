name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build ALIZA AI Debug APK
    runs-on: ubuntu-latesubuntu-latesubuntu-latestubuntu-latest

